name: testings
on:
  push:
    branches: ["main", "development"]
  pull_request:
    branches: ["main", "development"]
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # só o código da aplicação (test/ tem o exemplo de demonstração do Playwright)
      - name: Lint
        run: npx eslint src

      - name: Testes unitários
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://example.invalid/api/v1
