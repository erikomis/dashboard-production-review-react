name: testings
on:
  push:
    branches: ["main", "development"]
  pull_request:
    branches: ["main", "development"]
jobs:
  test:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npx eslint src test/e2e playwright.config.ts

      - name: Tipos dos E2E
        run: npx tsc -p tsconfig.e2e.json

      - name: Testes unitários e de componente
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://example.invalid/api/v1

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # API mockada com page.route: não precisa de backend no CI
      - name: Testes E2E
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
